<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex" />
		<title>FHUGAWZ form definitions</title>
	</head>
	<body>
		<form name="fhugawz-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="fhugawz-contact" />
			<input type="hidden" name="subject" value="New FHUGAWZ contact submission (%{submissionId})" data-remove-prefix />
			<input type="text" name="bot-field" />
			<input type="text" name="name" />
			<input type="email" name="email" />
			<textarea name="message"></textarea>
		</form>
	</body>
</html>
