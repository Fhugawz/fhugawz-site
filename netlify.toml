[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), usb=(), xr-spatial-tracking=()"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; form-action 'self'; upgrade-insecure-requests"

# Legacy pages with direct editorial equivalents. Force is needed because Astro
# still generates the old paths during the migration.
[[redirects]]
from = "/projects/199x"
to = "/worlds/199x"
status = 301
force = true

[[redirects]]
from = "/projects/axioms"
to = "/worlds/axioms"
status = 301
force = true

[[redirects]]
from = "/projects/protocol-7"
to = "/worlds/protocol-7"
status = 301
force = true

[[redirects]]
from = "/projects/archive"
to = "/worlds"
status = 301
force = true

[[redirects]]
from = "/projects"
to = "/worlds"
status = 301
force = true

[[redirects]]
